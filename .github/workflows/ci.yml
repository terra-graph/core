name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - rc/*
      - 1.x

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn verify
